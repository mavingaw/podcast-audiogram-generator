<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- 9:16 Aspect Ratio (Stories, TikTok, Reels, Shorts) -->
    <g id="icon-ratio-9-16">
      <rect x="4" y="2" width="16" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="2" />
      <circle cx="12" cy="18" r="1" fill="currentColor" />
    </g>

    <!-- 1:1 Aspect Ratio (Instagram / Square Feed) -->
    <g id="icon-ratio-1-1">
      <rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2" />
    </g>

    <!-- 16:9 Aspect Ratio (YouTube / Landscape Video) -->
    <g id="icon-ratio-16-9">
      <rect x="2" y="4" width="20" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2" />
    </g>

    <!-- Waveform Visualizer Symbol -->
    <g id="icon-waveform">
      <path d="M3 12h2M7 7v10M11 3v18M15 8v8M19 10v4M21 12h1" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Auto Captions / Subtitles -->
    <g id="icon-captions">
      <rect x="2" y="4" width="20" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2" />
      <path d="M6 10h12M6 14h7" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Audio Scrubber / Trim -->
    <g id="icon-trim">
      <circle cx="6" cy="6" r="3" fill="none" stroke="currentColor" stroke-width="2" />
      <circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="2" />
      <line x1="8.5" y1="7.5" x2="18" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <line x1="8.5" y1="16.5" x2="18" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- 4K Export / Download -->
    <g id="icon-export">
      <path d="M12 3v12M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M4 17v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Microphone Audio Track -->
    <g id="icon-mic">
      <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" fill="none" stroke="currentColor" stroke-width="2" />
      <path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4M8 22h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </defs>
</svg>