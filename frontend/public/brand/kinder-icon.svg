<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0B0D11" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#996515" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4EEFC" />
      <stop offset="50%" stop-color="#89CFF0" />
      <stop offset="100%" stop-color="#5EA8D6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#89CFF0" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#262C36" stroke-width="4" />

  <g filter="url(#glow)">
    <!-- Vertical Spine (Baby Blue) -->
    <rect x="140" y="128" width="48" height="256" rx="24" fill="url(#blueGrad)" />

    <!-- Upper Arm (Gold Leaf Arc) -->
    <path d="M 188 256 C 240 256, 300 200, 348 148 C 362 134, 384 146, 376 164 C 340 236, 280 276, 218 286 Z" 
          fill="url(#goldGrad)" />

    <!-- Lower Arm (Baby Blue Loop) -->
    <path d="M 210 270 L 338 368 C 354 380, 342 400, 322 396 C 274 388, 224 336, 188 298 Z" 
          fill="url(#blueGrad)" />

    <!-- Accent Dot (Gold) -->
    <circle cx="356" cy="148" r="14" fill="url(#goldGrad)" />
  </g>
</svg>