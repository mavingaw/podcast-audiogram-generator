name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Lets release.yml gate a publish on this suite rather than duplicating it.
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The renderer shells out to FFmpeg, and drawtext needs a real font file.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install -r backend/requirements-dev.txt
      - working-directory: backend
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm ci` fails if the lockfile drifted from package.json, which is the
      # check that keeps the image reproducible.
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      # These bootstrap a real admin on the throwaway container, which is fine
      # because the container is destroyed with the runner. Never point this at
      # a host you keep.
      PAS_EMAIL: ci@example.com
      PAS_PASSWORD: ci-verification-password
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: podcast-audiogram-studio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the container
        run: |
          docker run -d --name pas -p 8080:8080 podcast-audiogram-studio:ci
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "container never became healthy" >&2
          exit 1

      # Drives every connection the product depends on over HTTP.
      - name: Verify the API
        run: python scripts/verify.py --base-url http://localhost:8080 --email "$PAS_EMAIL" --password "$PAS_PASSWORD"

      # The API checks cannot see a React crash: a component that throws still
      # returns a valid bundle, and the page simply renders black.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify the interface
        working-directory: frontend
        run: npm run smoke -- --base-url http://localhost:8080 --email "$PAS_EMAIL" --password "$PAS_PASSWORD"

      - name: Container logs on failure
        if: failure()
        run: docker logs pas
