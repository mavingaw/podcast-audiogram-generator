name: release

# Publishes both images to GitHub Container Registry.
#
#   push to main   -> :edge      and :gpu-edge
#   tag v1.2.3     -> :1.2.3     and :gpu-1.2.3, plus :latest and :gpu
#
# Uses the workflow's built-in GITHUB_TOKEN, so nothing needs configuring
# beyond making the package public once, after the first successful run:
# Packages -> podcast-audiogram-generator -> Package settings -> Change
# visibility. Until then `docker pull` needs a login, which is the usual reason
# an Unraid template reports "image not found".

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  # Never publish something the suite has not passed.
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu
            dockerfile: Dockerfile
            suffix: ""
          - name: gpu
            dockerfile: Dockerfile.gpu
            suffix: "gpu-"
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # The GPU image is the same code with a different base, so it shares
          # the version and only differs by prefix.
          flavor: |
            latest=false
            prefix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.name }} image published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
